name: Release (crates.io + binaries + packages)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test before publishing
        run: cargo test

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux binary
        run: cargo build --release

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ppmm-linux-x64
          path: target/release/ppmm

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows binary
        run: cargo build --release

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: ppmm-windows-x64
          path: target/release/ppmm.exe

  build-macos-x64:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS x86_64 binary
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Upload macOS x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ppmm-macos-x64
          path: target/x86_64-apple-darwin/release/ppmm

  build-macos-arm64:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS ARM64 binary (Apple Silicon)
        run: |
          rustup target add aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ppmm-macos-arm64
          path: target/aarch64-apple-darwin/release/ppmm

  release:
    runs-on: ubuntu-latest
    needs: [publish-crates, build-linux, build-windows, build-macos-x64, build-macos-arm64]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Validate tag version matches Cargo.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f2)
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match Cargo.toml version (${CARGO_VERSION})"
            exit 1
          fi

      - name: Install zip & deb tools
        run: sudo apt-get update && sudo apt-get install -y zip dpkg-dev

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release directories
        run: |
          mkdir -p releases/linux releases/windows releases/macos
          cp artifacts/ppmm-linux-x64/ppmm releases/linux/ppmm-linux-x64
          cp artifacts/ppmm-windows-x64/ppmm.exe releases/windows/ppmm-windows-x64.exe
          cp artifacts/ppmm-macos-x64/ppmm releases/macos/ppmm-macos-x64
          cp artifacts/ppmm-macos-arm64/ppmm releases/macos/ppmm-macos-arm64
          chmod +x releases/linux/ppmm-linux-x64 releases/macos/ppmm-macos-x64 releases/macos/ppmm-macos-arm64

      - name: Zip Windows binary
        run: |
          cd releases/windows
          zip -r ppmm-windows-x64.zip ppmm-windows-x64.exe
          cd ../..

      - name: Build .deb package
        run: |
          VERSION=${GITHUB_REF##*/}          # v1.0.0
          VERSION=${VERSION#v}              # 1.0.0

          mkdir -p build/DEBIAN build/usr/bin
          cp releases/linux/ppmm-linux-x64 build/usr/bin/ppmm
          chmod +x build/usr/bin/ppmm
          cp packaging/deb/control build/DEBIAN/control
          sed -i "s/^Version: .*/Version: ${VERSION}/" build/DEBIAN/control

          dpkg-deb --build build ppmm_${VERSION}_amd64.deb
          echo "DEB_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            releases/windows/ppmm-windows-x64.zip
            releases/linux/ppmm-linux-x64
            releases/macos/ppmm-macos-x64
            releases/macos/ppmm-macos-arm64
            ppmm_${{ env.DEB_VERSION }}_amd64.deb

      - name: Generate winget manifest
        run: |
          VERSION=${GITHUB_REF##*/}          # v1.0.0
          VERSION=${VERSION#v}              # 1.0.0

          SHA256=$(sha256sum releases/windows/ppmm-windows-x64.zip | awk '{print $1}')
          mkdir -p packaging/winget

          {
            echo "Id: Sumangal44.ppmm"
            echo "Name: ppmm"
            echo "Version: $VERSION"
            echo "Publisher: Sumangal44"
            echo "License: MIT"
            echo "ShortDescription: Python Project Manager CLI"
            echo "Installers:"
            echo "  - Architecture: x64"
            echo "    InstallerType: portable"
            echo "    InstallerUrl: https://github.com/Sumangal44/ppmm/releases/download/v$VERSION/ppmm-windows-x64.zip"
            echo "    InstallerSha256: $SHA256"
          } > packaging/winget/ppmm.yaml

      - name: Upload winget manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: packaging/winget/ppmm.yaml
